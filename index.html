<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷你鋼琴</title>
  <style>
    :root {
      --bg-start: #FFE8E8;
      --bg-end: #EDE8F5;
      --glow-1: #FFCAD4;
      --glow-2: #D8B4F8;
      --text-color: #2D283E;
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-border: rgba(255, 255, 255, 0.9);
      --btn-bg: rgba(255, 255, 255, 0.88);
      --btn-text: #2D283E;
      --btn-border: rgba(255, 255, 255, 0.9);
      --white-key-bg: #FFFFFF;
      --white-key-border: #E2DFDE;
      --black-key-bg: #2B2830;
      --highlight-white: #FFE4ED;
      --highlight-white-border: #FF85A2;
      --highlight-black: #D291BC;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-color);
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* 柔焦裝飾球 */
    .glow-sphere {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
      transition: background 0.4s ease;
    }
    .glow-1 {
      width: 450px;
      height: 450px;
      background: var(--glow-1);
      top: -80px;
      left: -80px;
    }
    .glow-2 {
      width: 500px;
      height: 500px;
      background: var(--glow-2);
      bottom: -100px;
      right: -100px;
    }

    /* 主應用容器 */
    .piano-app {
      position: relative;
      z-index: 1;
      width: 96vw;
      max-width: 1300px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.12);
      padding: 24px 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.3s ease;
    }

    /* 全螢幕模式 */
    :fullscreen .piano-app,
    :-webkit-full-screen .piano-app {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border-radius: 0;
      padding: 16px 24px;
      justify-content: space-between;
    }

    /* 頂部標頭 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px dashed rgba(150, 150, 150, 0.25);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-color);
      transition: color 0.3s ease;
    }

    .status-badge {
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.7);
      color: var(--text-color);
      border: 1px solid rgba(150, 150, 150, 0.3);
      padding: 5px 14px;
      border-radius: 30px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    /* 控制列工具 */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .theme-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-color);
    }

    button, select, input[type="text"], input[type="color"] {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--btn-border);
      cursor: pointer;
      outline: none;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.3, 1);
      background: var(--btn-bg);
      color: var(--btn-text);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.12);
      filter: brightness(1.05);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.active {
      background: linear-gradient(135deg, #FF85A2, #A463F8);
      color: #FFFFFF !important;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(164, 99, 248, 0.35);
    }

    button.recording {
      background: #FF4757 !important;
      color: #FFFFFF !important;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); box-shadow: 0 0 14px rgba(255, 71, 87, 0.7); }
      100% { transform: scale(1); }
    }

    input[type="color"] {
      width: 36px;
      height: 36px;
      padding: 2px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #FFFFFF;
      vertical-align: middle;
    }

    /* 鋼琴自適應容器 */
    .piano-container {
      width: 100%;
      background: #25232A;
      border-radius: 22px;
      padding: 12px 14px 16px 14px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.25);
      position: relative;
      display: flex;
      justify-content: center;
    }

    :fullscreen .piano-container,
    :-webkit-full-screen .piano-container {
      flex: 1;
      height: 100%;
      min-height: 380px;
    }

    .piano-keys {
      position: relative;
      display: flex;
      width: 100%;
      height: 270px;
      max-width: 1220px;
    }

    :fullscreen .piano-keys,
    :-webkit-full-screen .piano-keys {
      height: 100%;
      max-width: none;
    }

    /* 琴鍵基礎設置 */
    .key {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 14px;
      cursor: pointer;
      transition: background 0.08s ease, transform 0.08s ease, box-shadow 0.08s ease;
    }

    .white-key {
      flex: 1;
      height: 100%;
      background: var(--white-key-bg);
      border: 1px solid var(--white-key-border);
      border-radius: 0 0 10px 10px;
      margin: 0 1.5px;
      z-index: 1;
      box-shadow: 0 5px 6px rgba(0,0,0,0.08);
    }

    .black-key {
      position: absolute;
      width: 4.2%;
      height: 60%;
      background: var(--black-key-bg);
      border-radius: 0 0 8px 8px;
      z-index: 2;
      box-shadow: 0 6px 12px rgba(0,0,0,0.35);
    }

    /* 琴鍵標籤 */
    .key-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      pointer-events: none;
    }

    .solfege {
      font-size: 0.86rem;
      font-weight: 800;
    }

    .kbd-hint {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .white-key .solfege { color: #5D5468; }
    .white-key .kbd-hint { background: #F3EBF4; color: #8F829A; }

    .black-key .solfege { color: #FFD3E2; }
    .black-key .kbd-hint { background: #4D4559; color: #FFF; }

    .hide-labels .key-label {
      display: none;
    }

    /* 視覺回饋與亮燈特效 */
    .enable-feedback .white-key.active,
    .white-key.auto-highlight {
      background: linear-gradient(to bottom, #FFFFFF 30%, #FFE4ED 100%) !important;
      transform: translateY(4px);
      border-color: var(--highlight-white-border) !important;
      box-shadow: 0 2px 14px rgba(255, 133, 162, 0.6), inset 0 -3px 8px rgba(255, 133, 162, 0.3) !important;
    }

    .enable-feedback .black-key.active,
    .black-key.auto-highlight {
      background: linear-gradient(to bottom, #3A3542 0%, #D291BC 100%) !important;
      transform: translateY(3px);
      box-shadow: 0 0 16px rgba(210, 145, 188, 0.9), 0 3px 6px rgba(0,0,0,0.4) !important;
    }

    /* 隱藏的錄製畫布 (用於產生 MP4 影片) */
    #renderCanvas {
      display: none;
    }

    /* 底部說明 */
    footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--text-color);
      opacity: 0.85;
      border-top: 1px dashed rgba(150, 150, 150, 0.25);
      padding-top: 10px;
    }

    .shortcut-badge {
      background: rgba(255, 255, 255, 0.6);
      padding: 2px 6px;
      border-radius: 5px;
      font-family: monospace;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="glow-sphere glow-1"></div>
  <div class="glow-sphere glow-2"></div>

  <div class="piano-app" id="pianoApp">
    <header>
      <div class="title-group">
        <h1>🎹 迷你鋼琴</h1>
        <div id="statusBadge" class="status-badge">✨ 準備就緒</div>
      </div>
      <div class="btn-group">
        <button id="toggleFullscreenBtn">⛶ 全螢幕模式</button>
      </div>
    </header>

    <div class="toolbar">
      <!-- 列一：主題色系切換與自由調色盤 -->
      <div class="toolbar-row">
        <div class="btn-group">
          <span class="theme-label">🎨 風格主題：</span>
          <select id="themeSelect">
            <option value="peach">🌸 夢幻蜜桃紫</option>
            <option value="dark">🌙 星空黑耀夜</option>
            <option value="matcha">🍵 清新莫蘭迪綠</option>
            <option value="sunset">🌅 落日暖陽橘</option>
            <option value="ocean">🌊 蔚藍晴空海</option>
          </select>
          <span class="theme-label">自由選色：</span>
          <input type="color" id="customColorPicker" value="#FFE8E8" title="自訂背景色彩">
        </div>

        <div class="btn-group">
          <button id="toggleFeedbackBtn" class="active">視覺回饋：開啟</button>
          <button id="toggleLabelsBtn">唱名標籤：顯示</button>
          <button id="toggleSustainBtn">延音效果：關閉</button>
        </div>
      </div>

      <!-- 列二：豐富完整的示範曲目 (古典與流行) -->
      <div class="toolbar-row">
        <div class="btn-group">
          <span class="theme-label">🎵 示範曲庫：</span>
          <select id="songSelect">
            <option value="none">-- 選擇示範曲目 (完整旋律) --</option>
            <option value="jay_sunny">★ 周杰倫 - 晴天 (完整副歌)</option>
            <option value="jolin_sun">★ 蔡依林 - 日不落 (完整副歌)</option>
            <option value="star">♫ 小星星 (完整版 A-B-A)</option>
            <option value="elise">♫ 給愛麗絲 (完整主題旋律)</option>
          </select>
          <button id="playSongBtn">▶ 播放示範</button>
          <button id="stopSongBtn">⏹ 停止</button>
        </div>
      </div>

      <!-- 列三：錄音與真實音訊/影片 (WAV, MP3, MP4) 匯出 -->
      <div class="toolbar-row">
        <div class="btn-group">
          <button id="recordBtn">⏺ 開始錄音</button>
          <button id="playRecordBtn" disabled>▶ 回放錄音</button>
        </div>

        <div class="btn-group">
          <span class="theme-label">匯出檔案：</span>
          <button id="exportWavBtn" disabled>⬇ 匯出 WAV (無損音訊)</button>
          <button id="exportMp3Btn" disabled>⬇ 匯出 MP3 (通用音訊)</button>
          <button id="exportMp4Btn" disabled>🎬 匯出 MP4 (演奏影片)</button>
        </div>
      </div>
    </div>

    <!-- 鋼琴主鍵盤 -->
    <div class="piano-container">
      <div class="piano-keys enable-feedback" id="pianoKeys"></div>
    </div>

    <!-- 隱藏畫布：用以繪製琴鍵並側錄 MP4 影片 -->
    <canvas id="renderCanvas" width="900" height="350"></canvas>

    <footer>
      <div>💡 支援滑鼠點擊、按住滑動滑奏 (Glissando)、觸控與電腦實體鍵盤彈奏</div>
      <div>
        低八度：<span class="shortcut-badge">A S D F G H J</span> / 黑鍵：<span class="shortcut-badge">W E T Y U</span>
        | 高八度：<span class="shortcut-badge">K L ; ' Z X C V</span> / 黑鍵：<span class="shortcut-badge">O P [ ] \</span>
      </div>
    </footer>
  </div>

  <script>
    /* =========================================
       1. 25 鍵音名與頻率資料庫 (中央 C4 至高音 C6)
       ========================================= */
    const NOTES = [
      { note: 'C4',  solfege: 'Do',  freq: 261.63, key: 'a',  type: 'white' },
      { note: 'C#4', solfege: 'Di',  freq: 277.18, key: 'w',  type: 'black' },
      { note: 'D4',  solfege: 'Re',  freq: 293.66, key: 's',  type: 'white' },
      { note: 'D#4', solfege: 'Ri',  freq: 311.13, key: 'e',  type: 'black' },
      { note: 'E4',  solfege: 'Mi',  freq: 329.63, key: 'd',  type: 'white' },
      { note: 'F4',  solfege: 'Fa',  freq: 349.23, key: 'f',  type: 'white' },
      { note: 'F#4', solfege: 'Fi',  freq: 369.99, key: 't',  type: 'black' },
      { note: 'G4',  solfege: 'Sol', freq: 392.00, key: 'g',  type: 'white' },
      { note: 'G#4', solfege: 'Si',  freq: 415.30, key: 'y',  type: 'black' },
      { note: 'A4',  solfege: 'La',  freq: 440.00, key: 'h',  type: 'white' },
      { note: 'A#4', solfege: 'Li',  freq: 466.16, key: 'u',  type: 'black' },
      { note: 'B4',  solfege: 'Ti',  freq: 493.88, key: 'j',  type: 'white' },

      { note: 'C5',  solfege: 'Do',  freq: 523.25, key: 'k',  type: 'white' },
      { note: 'C#5', solfege: 'Di',  freq: 554.37, key: 'o',  type: 'black' },
      { note: 'D5',  solfege: 'Re',  freq: 587.33, key: 'l',  type: 'white' },
      { note: 'D#5', solfege: 'Ri',  freq: 622.25, key: 'p',  type: 'black' },
      { note: 'E5',  solfege: 'Mi',  freq: 659.25, key: ';',  type: 'white' },
      { note: 'F5',  solfege: 'Fa',  freq: 698.46, key: "'",  type: 'white' },
      { note: 'F#5', solfege: 'Fi',  freq: 739.99, key: '[',  type: 'black' },
      { note: 'G5',  solfege: 'Sol', freq: 783.99, key: 'z',  type: 'white' },
      { note: 'G#5', solfege: 'Si',  freq: 830.61, key: ']',  type: 'black' },
      { note: 'A5',  solfege: 'La',  freq: 880.00, key: 'x',  type: 'white' },
      { note: 'A#5', solfege: 'Li',  freq: 932.33, key: '\\', type: 'black' },
      { note: 'B5',  solfege: 'Ti',  freq: 987.77, key: 'c',  type: 'white' },
      { note: 'C6',  solfege: 'Do',  freq: 1046.50, key: 'v', type: 'white' }
    ];

    /* =========================================
       2. Web Audio API 音效合成引擎與串流錄製
       ========================================= */
    let audioCtx = null;
    let masterAudioDestination = null; // 用於音訊錄製的音源匯總節點
    let audioMediaStreamDest = null;
    let sustainEnabled = false;
    let visualFeedbackEnabled = true;
    const activeVoices = new Map();

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();

        // 建立音訊匯總節點，同時輸出至揚聲器與錄音節點
        masterAudioDestination = audioCtx.createGain();
        masterAudioDestination.connect(audioCtx.destination);

        audioMediaStreamDest = audioCtx.createMediaStreamDestination();
        masterAudioDestination.connect(audioMediaStreamDest);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playNote(freq) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      // 主震盪器 (正弦波)
      const osc1 = ctx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(freq, now);

      // 泛音震盪器 (三角波，鋼琴木質共鳴)
      const osc2 = ctx.createOscillator();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq * 2, now);

      const osc2Gain = ctx.createGain();
      osc2Gain.gain.setValueAtTime(0.24, now);
      osc2.connect(osc2Gain);

      // ADSR 音量包絡
      const noteGain = ctx.createGain();
      noteGain.gain.setValueAtTime(0.001, now);
      noteGain.gain.exponentialRampToValueAtTime(0.65, now + 0.005);
      noteGain.gain.exponentialRampToValueAtTime(0.38, now + 0.28);

      osc1.connect(noteGain);
      osc2Gain.connect(noteGain);
      noteGain.connect(masterAudioDestination);

      osc1.start(now);
      osc2.start(now);

      return { osc1, osc2, noteGain };
    }

    function stopNoteVoice(voice) {
      if (!voice || !audioCtx) return;
      const now = audioCtx.currentTime;
      const releaseTime = sustainEnabled ? 2.6 : 0.22;

      voice.noteGain.gain.cancelScheduledValues(now);
      voice.noteGain.gain.setValueAtTime(voice.noteGain.gain.value, now);
      voice.noteGain.gain.exponentialRampToValueAtTime(0.0001, now + releaseTime);

      voice.osc1.stop(now + releaseTime + 0.05);
      voice.osc2.stop(now + releaseTime + 0.05);
    }

    function triggerNoteStart(noteObj, isAutoPlay = false) {
      if (activeVoices.has(noteObj.note)) return;
      const voice = playNote(noteObj.freq);
      activeVoices.set(noteObj.note, voice);

      const keyEl = noteElements.get(noteObj.note);
      if (keyEl) {
        if (isAutoPlay) keyEl.classList.add('auto-highlight');
        else keyEl.classList.add('active');
      }

      if (isRecording && !isAutoPlay) {
        recordedEvents.push({
          note: noteObj.note,
          action: 'down',
          time: performance.now() - recordStartTime
        });
      }
    }

    function triggerNoteEnd(noteObj, isAutoPlay = false) {
      const voice = activeVoices.get(noteObj.note);
      if (voice) {
        stopNoteVoice(voice);
        activeVoices.delete(noteObj.note);
      }

      const keyEl = noteElements.get(noteObj.note);
      if (keyEl) {
        keyEl.classList.remove('active', 'auto-highlight');
      }

      if (isRecording && !isAutoPlay) {
        recordedEvents.push({
          note: noteObj.note,
          action: 'up',
          time: performance.now() - recordStartTime
        });
      }
    }

    /* =========================================
       3. 琴鍵渲染與自適應佈局
       ========================================= */
    const pianoKeysEl = document.getElementById('pianoKeys');
    const noteMapByNote = new Map();
    const noteMapByKey = new Map();
    const noteElements = new Map();
    const TOTAL_WHITE_KEYS = 15;

    function buildPiano() {
      let whiteKeyIndex = 0;

      NOTES.forEach((item) => {
        noteMapByNote.set(item.note, item);
        noteMapByKey.set(item.key.toLowerCase(), item);

        const keyEl = document.createElement('div');
        keyEl.className = `key ${item.type === 'white' ? 'white-key' : 'black-key'}`;
        keyEl.dataset.note = item.note;
        noteElements.set(item.note, keyEl);

        const labelEl = document.createElement('div');
        labelEl.className = 'key-label';

        const solfegeSpan = document.createElement('span');
        solfegeSpan.className = 'solfege';
        solfegeSpan.textContent = item.solfege;

        const kbdSpan = document.createElement('span');
        kbdSpan.className = 'kbd-hint';
        kbdSpan.textContent = item.key.toUpperCase();

        labelEl.appendChild(solfegeSpan);
        labelEl.appendChild(kbdSpan);
        keyEl.appendChild(labelEl);

        if (item.type === 'white') {
          pianoKeysEl.appendChild(keyEl);
          whiteKeyIndex++;
        } else {
          const percentLeft = (whiteKeyIndex / TOTAL_WHITE_KEYS) * 100 - (4.2 / 2);
          keyEl.style.left = `${percentLeft}%`;
          pianoKeysEl.appendChild(keyEl);
        }
      });
    }

    buildPiano();

    /* =========================================
       4. 滑鼠、觸控與鍵盤事件監聽
       ========================================= */
    let isMouseDown = false;

    window.addEventListener('mousedown', () => { isMouseDown = true; });
    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      activeVoices.forEach((_, noteName) => {
        const item = noteMapByNote.get(noteName);
        if (item) triggerNoteEnd(item);
      });
    });

    document.querySelectorAll('.key').forEach(keyEl => {
      const noteObj = noteMapByNote.get(keyEl.dataset.note);

      keyEl.addEventListener('mousedown', (e) => {
        e.preventDefault();
        triggerNoteStart(noteObj);
      });

      keyEl.addEventListener('mouseenter', () => {
        if (isMouseDown) triggerNoteStart(noteObj);
      });

      e.preventDefault();
      const touch = e.touches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      const keyEl = target ? target.closest('.key') : null;

      if (keyEl) {
        const noteObj = noteMapByNote.get(keyEl.dataset.note);
        if (noteObj && noteObj !== currentTouchNote) {
          if (currentTouchNote) triggerNoteEnd(currentTouchNote);
          currentTouchNote = noteObj;
          triggerNoteStart(noteObj);
        }
      } else if (currentTouchNote) {

      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function updateContrastForColor(hex) {
      const { r, g, b } = hexToRgb(hex);
      const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
      const root = document.documentElement;

      if (luminance < 140) {
        // 深色背景：白字、深色半透明面板
        root.style.setProperty('--text-color', '#FFFFFF');

    /* --- 8.1 離線渲染產生 100% 原音無損 WAV / MP3 檔案 --- */
    function renderOfflineAudioBuffer(events, callback) {
      if (events.length === 0) return;
      const totalDur = (events[events.length - 1].time + 2000) / 1000;
      const sampleRate = 44100;
      const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, sampleRate * totalDur, sampleRate);

      events.forEach(ev => {
        if (ev.action === 'down') {
          const noteObj = noteMapByNote.get(ev.note);
          if (!noteObj) return;
          const startTime = ev.time / 1000;

          const osc1 = offlineCtx.createOscillator();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(noteObj.freq, startTime);

          const osc2 = offlineCtx.createOscillator();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(noteObj.freq * 2, startTime);

          const osc2Gain = offlineCtx.createGain();
          osc2Gain.gain.setValueAtTime(0.24, startTime);
          osc2.connect(osc2Gain);

          const noteGain = offlineCtx.createGain();
          noteGain.gain.setValueAtTime(0.001, startTime);
          noteGain.gain.exponentialRampToValueAtTime(0.65, startTime + 0.005);
          noteGain.gain.exponentialRampToValueAtTime(0.38, startTime + 0.28);
          // 釋音衰減
          const release = sustainEnabled ? 2.5 : 0.25;
          noteGain.gain.exponentialRampToValueAtTime(0.0001, startTime + release + 0.3);

          osc1.connect(noteGain);
          osc2Gain.connect(noteGain);
          noteGain.connect(offlineCtx.destination);

          osc1.start(startTime);
          osc2.start(startTime);
          osc1.stop(startTime + release + 0.35);
          osc2.stop(startTime + release + 0.35);
        }
      });

      offlineCtx.startRendering().then(renderedBuffer => {
        callback(renderedBuffer);
      });
    }

    // 將 AudioBuffer 編碼為標準 16-bit PCM WAV 檔案 Blob
    function bufferToWavBlob(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      const channels = [];
      let sampleRate = buffer.sampleRate;
      let offset = 0;
      let pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      // RIFF header
      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);  // file length - 8
      setUint32(0x45564157); // "WAVE"
      setUint32(0x20746d66); // "fmt "
      setUint32(16);         // length of format data
      setUint16(1);          // PCM format
      setUint16(numOfChan);
      setUint32(sampleRate);
      setUint32(sampleRate * 2 * numOfChan); // byte rate
      setUint16(numOfChan * 2);              // block align
      setUint16(16);                         // bits per sample
      setUint32(0x61746164); // "data"
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out], { type: 'audio/wav' });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    /* --- 8.2 Canvas 繪製琴鍵畫面 + 側錄匯出 MP4 影片 --- */
    const renderCanvas = document.getElementById('renderCanvas');
    const ctx2d = renderCanvas.getContext('2d');

    function drawPianoToCanvas(activeNotesSet) {
      const w = renderCanvas.width;
      const h = renderCanvas.height;

      // 繪製漸層背景
      const grad = ctx2d.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#FFE8E8');
      grad.addColorStop(1, '#EDE8F5');
      ctx2d.fillStyle = grad;
      ctx2d.fillRect(0, 0, w, h);

      // 標題
      ctx2d.fillStyle = '#FF758C';
      ctx2d.font = 'bold 22px Nunito, sans-serif';
      ctx2d.fillText('🎹 迷你鋼琴 - 精彩演奏影片', 40, 45);

      // 琴身邊界
      const pianoX = 40, pianoY = 70, pianoW = w - 80, pianoH = h - 100;
      ctx2d.fillStyle = '#25232A';
      ctx2d.beginPath();
      ctx2d.roundRect(pianoX, pianoY, pianoW, pianoH, 14);
      ctx2d.fill();

      const whiteW = (pianoW - 16) / TOTAL_WHITE_KEYS;
      const blackW = whiteW * 0.65;
      const blackH = (pianoH - 20) * 0.6;
      let curX = pianoX + 8;

      // 1. 繪製白鍵
      const whiteNotes = NOTES.filter(n => n.type === 'white');
      whiteNotes.forEach((n, idx) => {
        const isLit = activeNotesSet.has(n.note);
        ctx2d.fillStyle = isLit ? '#FFE4ED' : '#FFFFFF';
        ctx2d.strokeStyle = isLit ? '#FF85A2' : '#E2DFDE';
        ctx2d.lineWidth = isLit ? 3 : 1;

        ctx2d.beginPath();
        ctx2d.roundRect(curX + (idx * whiteW) + 1, pianoY + 8, whiteW - 2, pianoH - 16, [0, 0, 6, 6]);
        ctx2d.fill();
        ctx2d.stroke();

        // 唱名標記
        ctx2d.fillStyle = '#5D5468';
        ctx2d.font = 'bold 12px sans-serif';
        ctx2d.textAlign = 'center';
        ctx2d.fillText(n.solfege, curX + (idx * whiteW) + (whiteW / 2), pianoY + pianoH - 24);
      });

      // 2. 繪製黑鍵
      let wIdx = 0;
      NOTES.forEach(n => {
        if (n.type === 'white') {
          wIdx++;
        } else {
          const bx = curX + (wIdx * whiteW) - (blackW / 2);
          const isLit = activeNotesSet.has(n.note);
          ctx2d.fillStyle = isLit ? '#D291BC' : '#2B2830';

          ctx2d.beginPath();
          ctx2d.roundRect(bx, pianoY + 8, blackW, blackH, [0, 0, 5, 5]);
          ctx2d.fill();
          if (isLit) {
            ctx2d.strokeStyle = '#FFFFFF';
            ctx2d.lineWidth = 2;
            ctx2d.stroke();
          }
        }
      });
    }

    exportMp4Btn.addEventListener('click', () => {
      if (recordedEvents.length === 0) return;
      statusBadge.textContent = '🎬 正在側錄合成 MP4 影片中，請稍候...';
      exportMp4Btn.disabled = true;

      // 擷取 Canvas 影像與 Web Audio 聲音串流
      const canvasStream = renderCanvas.captureStream(30);
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioMediaStreamDest.stream.getAudioTracks()
      ]);

      let videoRecorder = null;
      let videoChunks = [];

      // 優先選用 MP4 格式，若瀏覽器未支援則自動相容 WebM 封裝
      const mimeTypes = ['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
      let selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || '';

      try {
        videoRecorder = new MediaRecorder(combinedStream, selectedMime ? { mimeType: selectedMime } : {});
      } catch (e) {
        videoRecorder = new MediaRecorder(combinedStream);
      }

      videoRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) videoChunks.push(e.data);
      };

      videoRecorder.onstop = () => {
        const ext = selectedMime.includes('mp4') ? 'mp4' : 'mp4';
        const videoBlob = new Blob(videoChunks, { type: selectedMime || 'video/mp4' });
        downloadBlob(videoBlob, `迷你鋼琴_演奏影片_${Date.now()}.${ext}`);
        statusBadge.textContent = '🎬 MP4 演奏影片已匯出完成！';
        exportMp4Btn.disabled = false;
      };

      videoRecorder.start();

      // 在畫布上重播所有音符並渲染畫面
      const activeKeysCanvas = new Set();
      drawPianoToCanvas(activeKeysCanvas);

      recordedEvents.forEach(ev => {
        setTimeout(() => {
          const noteObj = noteMapByNote.get(ev.note);
          if (noteObj) {
            if (ev.action === 'down') {
              activeKeysCanvas.add(ev.note);
              triggerNoteStart(noteObj, true);
            } else {
              activeKeysCanvas.delete(ev.note);
              triggerNoteEnd(noteObj, true);
            }
            drawPianoToCanvas(activeKeysCanvas);
          }
        }, ev.time);
      });

      const totalTime = (recordedEvents[recordedEvents.length - 1]?.time || 0) + 1000;
      setTimeout(() => {
        videoRecorder.stop();
        activeKeysCanvas.clear();
        drawPianoToCanvas(activeKeysCanvas);
      }, totalTime);
    });
  </script>
</body>
</html>
