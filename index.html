<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷你鋼琴 (Mini Piano)</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #FFE8E8 0%, #F5E8FF 50%, #EDE8F5 100%);
      --glow-1: #FFCAD4;
      --glow-2: #D8B4F8;
      --glass-bg: rgba(255, 255, 255, 0.76);
      --glass-border: rgba(255, 255, 255, 0.9);
      --text-color: #4A4453;
      --white-key-bg: #FFFFFF;
      --white-key-border: #E2DFDE;
      --black-key-bg: #2B2830;
      --highlight-white: #FFE4ED;
      --highlight-white-border: #FF85A2;
      --highlight-black: #D291BC;
      --shadow-soft: 0 12px 36px rgba(160, 140, 180, 0.18);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text-color);
      background: var(--bg-gradient);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
      transition: background 0.4s ease;
    }

    /* 柔焦光暈裝飾 */
    .glow-sphere {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.65;
      transition: background 0.4s ease;
    }
    .glow-1 {
      width: 460px;
      height: 460px;
      background: var(--glow-1);
      top: -100px;
      left: -100px;
    }
    .glow-2 {
      width: 500px;
      height: 500px;
      background: var(--glow-2);
      bottom: -120px;
      right: -120px;
    }

    /* 主應用卡片 */
    .piano-app {
      position: relative;
      z-index: 1;
      width: 96vw;
      max-width: 1320px;
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      box-shadow: var(--shadow-soft);
      padding: 22px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.3s ease;
    }

    :fullscreen .piano-app,
    :-webkit-full-screen .piano-app {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border-radius: 0;
      padding: 16px 24px;
      justify-content: space-between;
    }

    /* 頂部標頭與 SVG 動畫 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px dashed rgba(224, 187, 228, 0.4);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 純 SVG 可愛小貓與音符動效 */
    .cat-avatar {
      width: 44px;
      height: 44px;
      animation: catBob 2.5s ease-in-out infinite alternate;
    }
    @keyframes catBob {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-4px) rotate(4deg); }
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(45deg, #FF758C, #A463F8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 133, 162, 0.4);
      padding: 5px 14px;
      border-radius: 30px;
      font-weight: 700;
      color: #E26488;
      box-shadow: 0 2px 8px rgba(226, 100, 136, 0.1);
    }

    /* 工具面板 */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button, select, input[type="text"] {
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      cursor: pointer;
      outline: none;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.3, 1);
      background: rgba(255, 255, 255, 0.88);
      color: var(--text-color);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
    }

    button:hover {
      background: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(180, 160, 200, 0.22);
    }

    button:active {
      transform: translateY(0);
    }

    button.active {
      background: linear-gradient(135deg, #FF94B4, #FF758C);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(255, 117, 140, 0.35);
    }

    button.recording {
      background: #FF5E7E;
      color: white;
      animation: heartPulse 1.1s infinite;
    }

    @keyframes heartPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); box-shadow: 0 0 16px rgba(255, 94, 126, 0.6); }
      100% { transform: scale(1); }
    }

    select, input[type="text"] {
      background: #FFFFFF;
    }

    input[type="text"] {
      width: 140px;
      padding: 7px 12px;
      cursor: text;
    }

    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.85);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid #ccc; border-radius: 50%; }

    /* 自訂樂譜學習輸入列 */
    .sheet-learning-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.6);
      padding: 8px 12px;
      border-radius: 16px;
      border: 1px dashed rgba(200, 180, 220, 0.6);
      flex-wrap: wrap;
    }

    .sheet-input {
      flex: 1;
      min-width: 260px;
      padding: 7px 12px !important;
      border-radius: 12px !important;
    }

    /* 鋼琴自適應容器 */
    .piano-container {
      width: 100%;
      background: #25232A;
      border-radius: 22px;
      padding: 12px 14px 16px 14px;
      box-shadow: 0 14px 40px rgba(35, 25, 45, 0.25);
      position: relative;
      display: flex;
      justify-content: center;
    }

    :fullscreen .piano-container,
    :-webkit-full-screen .piano-container {
      flex: 1;
      height: 100%;
      min-height: 380px;
    }

    .piano-keys {
      position: relative;
      display: flex;
      width: 100%;
      height: 270px;
      max-width: 1200px;
    }

    :fullscreen .piano-keys,
    :-webkit-full-screen .piano-keys {
      height: 100%;
      max-width: none;
    }

    /* 琴鍵百分比彈性佈局 */
    .key {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 14px;
      cursor: pointer;
      transition: background 0.08s ease, transform 0.08s ease, box-shadow 0.08s ease;
    }

    .white-key {
      flex: 1;
      height: 100%;
      background: var(--white-key-bg);
      border: 1px solid var(--white-key-border);
      border-radius: 0 0 10px 10px;
      margin: 0 1.5px;
      z-index: 1;
      box-shadow: 0 5px 6px rgba(0,0,0,0.08);
    }

    .black-key {
      position: absolute;
      width: 4.2%;
      height: 60%;
      background: var(--black-key-bg);
      border-radius: 0 0 8px 8px;
      z-index: 2;
      box-shadow: 0 6px 12px rgba(0,0,0,0.35);
    }

    /* 標籤樣式 */
    .key-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      pointer-events: none;
    }

    .solfege {
      font-size: 0.86rem;
      font-weight: 800;
    }

    .kbd-hint {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .white-key .solfege { color: #5D5468; }
    .white-key .kbd-hint { background: #F3EBF4; color: #8F829A; }

    .black-key .solfege { color: #FFD3E2; }
    .black-key .kbd-hint { background: #4D4559; color: #FFF; }

    .hide-labels .key-label {
      display: none;
    }

    /* 視覺回饋與亮鍵效果 */
    .enable-feedback .white-key.active,
    .white-key.auto-highlight {
      background: linear-gradient(to bottom, #FFFFFF 30%, #FFE4ED 100%) !important;
      transform: translateY(4px);
      border-color: var(--highlight-white-border) !important;
      box-shadow: 0 2px 14px rgba(255, 133, 162, 0.6), inset 0 -3px 8px rgba(255, 133, 162, 0.3) !important;
    }

    .enable-feedback .black-key.active,
    .black-key.auto-highlight {
      background: linear-gradient(to bottom, #3A3542 0%, #D291BC 100%) !important;
      transform: translateY(3px);
      box-shadow: 0 0 16px rgba(210, 145, 188, 0.9), 0 3px 6px rgba(0,0,0,0.4) !important;
    }

    /* 隱藏畫布 (用於影片錄製合成) */
    #recorderCanvas {
      display: none;
    }

    /* 底部操作指引 */
    footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.82rem;
      color: #8C8496;
      border-top: 1px dashed rgba(224, 187, 228, 0.5);
      padding-top: 12px;
    }

    .shortcut-badge {
      background: rgba(255, 255, 255, 0.75);
      padding: 2px 7px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 700;
      color: #6C5A7D;
    }
  </style>
</head>
<body>

  <!-- 背景柔焦夢幻光暈 -->
  <div class="glow-sphere glow-1" id="glow1"></div>
  <div class="glow-sphere glow-2" id="glow2"></div>

  <!-- 用於錄影渲染之隱藏畫布 -->
  <canvas id="recorderCanvas" width="960" height="320"></canvas>

  <div class="piano-app" id="pianoApp">
    <header>
      <div class="title-group">
        <!-- 可愛純 SVG 貓咪插圖 -->
        <svg class="cat-avatar" viewBox="0 0 100 100">
          <circle cx="50" cy="54" r="36" fill="#FFF1F5" stroke="#FFAAA6" stroke-width="3"/>
          <polygon points="26,26 34,44 18,40" fill="#FFAAA6"/>
          <polygon points="74,26 66,44 82,40" fill="#FFAAA6"/>
          <circle cx="38" cy="52" r="4.5" fill="#5D576B"/>
          <circle cx="62" cy="52" r="4.5" fill="#5D576B"/>
          <ellipse cx="50" cy="60" rx="3.5" ry="2.5" fill="#FF8B94"/>
          <path d="M44,65 Q50,70 56,65" fill="none" stroke="#5D576B" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="28" cy="58" r="4" fill="#FFCAD4" opacity="0.6"/>
          <circle cx="72" cy="58" r="4" fill="#FFCAD4" opacity="0.6"/>
        </svg>
        <h1>迷你鋼琴 <span>♪</span></h1>
        <div id="statusBadge" class="status-badge">✨ 準備就緒</div>
      </div>
      <div class="btn-group">
        <button id="toggleFullscreenBtn">⛶ 全螢幕模式</button>
      </div>
    </header>

    <div class="toolbar">
      <!-- 列一：主題選色、視覺與演奏設定 -->
      <div class="toolbar-row">
        <div class="btn-group">
          <!-- 5 大主題風格 -->
          <select id="themeSelect">
            <option value="dream">🌸 夢幻粉紫 (預設)</option>
            <option value="dark">🌙 星空暗夜 (黑曜)</option>
            <option value="mint">🍵 清新薄荷 (抹茶)</option>
            <option value="sunset">🌅 夕陽暮色 (暖橙)</option>
            <option value="glacier">❄ 冰川晴藍 (冰晶)</option>
          </select>
          <div class="color-picker-wrap">
            <span>🎨 自訂色盤</span>
            <input type="color" id="customColorPicker" value="#FFCAD4" title="自訂背景主調色">
          </div>
          <button id="toggleFeedbackBtn" class="active">視覺回饋：開</button>
          <button id="toggleLabelsBtn">唱名標籤：顯</button>
          <button id="toggleSustainBtn">延音：關</button>
        </div>

        <!-- 內建完整曲庫 -->
        <div class="btn-group">
          <select id="songSelect">
            <option value="none">-- 選擇完整範例曲目 --</option>
            <option value="star">★ 小星星 (完整版 A-B-A)</option>
            <option value="elise">♫ 給愛麗絲 (完整主題旋律)</option>
            <option value="birthday">🎂 生日快樂歌 (完整版)</option>
            <option value="canon">🎼 卡農 (經典主旋律)</option>
            <option value="wind">🍃 流行歌曲：《起風了》</option>
          </select>
          <button id="playSongBtn">▶ 播放示範</button>
          <button id="stopSongBtn">⏹ 停止</button>
        </div>
      </div>

      <!-- 列二：自訂樂譜輸入與學習引擎 -->
      <div class="sheet-learning-bar">
        <span style="font-weight: 800; font-size: 0.85rem;">📖 自訂樂譜學習：</span>
        <input type="text" id="customSheetInput" class="sheet-input" placeholder="貼上音名(如 C4 D4 E4 G4) 或按鍵(如 A S D G) 或簡譜(如 1 2 3 5)..." />
        <button id="playCustomSheetBtn">▶ 示範自訂樂譜</button>
        <button id="fillSampleSheetBtn">💡 載入《兩隻老虎》範本</button>
      </div>

      <!-- 列三：實體影音錄製 (WAV / MP3音訊 / MP4影片) -->
      <div class="toolbar-row">
        <div class="btn-group">
          <button id="recordBtn">⏺ 開始錄製</button>
          <button id="playRecordBtn" disabled>▶ 回放錄音</button>
          <input type="text" id="songNameInput" placeholder="曲目名稱..." disabled />
        </div>

        <div class="btn-group">
          <button id="exportWavBtn" disabled>🎵 下載 WAV 音訊</button>
          <button id="exportMp3Btn" disabled>🎧 下載 MP3 音訊</button>
          <button id="exportVideoBtn" disabled>🎬 下載 MP4 演奏影片</button>
        </div>
      </div>
    </div>

    <!-- 鋼琴鍵盤本體 -->
    <div class="piano-container">
      <div class="piano-keys enable-feedback" id="pianoKeys"></div>
    </div>

    <footer>
      <div>💡 支援滑鼠點擊、按住滑動滑奏 (Glissando)、觸控與電腦鍵盤彈奏</div>
      <div>
        低音組：<span class="shortcut-badge">A S D F G H J</span> / 黑鍵：<span class="shortcut-badge">W E T Y U</span>
        | 高音組：<span class="shortcut-badge">K L ; ' Z X C V</span> / 黑鍵：<span class="shortcut-badge">O P [ ] \</span>
      </div>
    </footer>
  </div>

  <script>
    /* =========================================
       1. 25 鍵音符資料庫 (中央 C4 ~ 高音 C6)
       ========================================= */
    const NOTES = [
      { note: 'C4',  solfege: 'Do',  freq: 261.63, key: 'a',  type: 'white', num: '1' },
      { note: 'C#4', solfege: 'Di',  freq: 277.18, key: 'w',  type: 'black', num: '1#' },
      { note: 'D4',  solfege: 'Re',  freq: 293.66, key: 's',  type: 'white', num: '2' },
      { note: 'D#4', solfege: 'Ri',  freq: 311.13, key: 'e',  type: 'black', num: '2#' },
      { note: 'E4',  solfege: 'Mi',  freq: 329.63, key: 'd',  type: 'white', num: '3' },
      { note: 'F4',  solfege: 'Fa',  freq: 349.23, key: 'f',  type: 'white', num: '4' },
      { note: 'F#4', solfege: 'Fi',  freq: 369.99, key: 't',  type: 'black', num: '4#' },
      { note: 'G4',  solfege: 'Sol', freq: 392.00, key: 'g',  type: 'white', num: '5' },
      { note: 'G#4', solfege: 'Si',  freq: 415.30, key: 'y',  type: 'black', num: '5#' },
      { note: 'A4',  solfege: 'La',  freq: 440.00, key: 'h',  type: 'white', num: '6' },
      { note: 'A#4', solfege: 'Li',  freq: 466.16, key: 'u',  type: 'black', num: '6#' },
      { note: 'B4',  solfege: 'Ti',  freq: 493.88, key: 'j',  type: 'white', num: '7' },

      { note: 'C5',  solfege: 'Do',  freq: 523.25, key: 'k',  type: 'white', num: '1.' },
      { note: 'C#5', solfege: 'Di',  freq: 554.37, key: 'o',  type: 'black', num: '1.#' },
      { note: 'D5',  solfege: 'Re',  freq: 587.33, key: 'l',  type: 'white', num: '2.' },
      { note: 'D#5', solfege: 'Ri',  freq: 622.25, key: 'p',  type: 'black', num: '2.#' },
      { note: 'E5',  solfege: 'Mi',  freq: 659.25, key: ';',  type: 'white', num: '3.' },
      { note: 'F5',  solfege: 'Fa',  freq: 698.46, key: "'",  type: 'white', num: '4.' },
      { note: 'F#5', solfege: 'Fi',  freq: 739.99, key: '[',  type: 'black', num: '4.#' },
      { note: 'G5',  solfege: 'Sol', freq: 783.99, key: 'z',  type: 'white', num: '5.' },
      { note: 'G#5', solfege: 'Si',  freq: 830.61, key: ']',  type: 'black', num: '5.#' },
      { note: 'A5',  solfege: 'La',  freq: 880.00, key: 'x',  type: 'white', num: '6.' },
      { note: 'A#5', solfege: 'Li',  freq: 932.33, key: '\\', type: 'black', num: '6.#' },
      { note: 'B5',  solfege: 'Ti',  freq: 987.77, key: 'c',  type: 'white', num: '7.' },
      { note: 'C6',  solfege: 'Do',  freq: 1046.50, key: 'v', type: 'white', num: '1..' }
    ];

    /* =========================================
       2. Web Audio API 與錄音串流 (MediaStreamDestination)
       ========================================= */
    let audioCtx = null;
    let streamDest = null;
    let sustainEnabled = false;
    let visualFeedbackEnabled = true;
    const activeVoices = new Map();

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        streamDest = audioCtx.createMediaStreamDestination();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playNote(freq) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      const osc1 = ctx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(freq, now);

      const osc2 = ctx.createOscillator();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq * 2, now);

      const osc2Gain = ctx.createGain();
      osc2Gain.gain.setValueAtTime(0.24, now);
      osc2.connect(osc2Gain);

      const masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(0.001, now);
      masterGain.gain.exponentialRampToValueAtTime(0.65, now + 0.005);
      masterGain.gain.exponentialRampToValueAtTime(0.38, now + 0.28);

      osc1.connect(masterGain);
      osc2Gain.connect(masterGain);

      // 同時輸出至喇叭 與 錄音串流
      masterGain.connect(ctx.destination);
      if (streamDest) masterGain.connect(streamDest);

      osc1.start(now);
      osc2.start(now);

      return { osc1, osc2, masterGain };
    }

    function stopNoteVoice(voice) {
      if (!voice || !audioCtx) return;
      const now = audioCtx.currentTime;
      const releaseTime = sustainEnabled ? 2.6 : 0.22;

      voice.masterGain.gain.cancelScheduledValues(now);
      voice.masterGain.gain.setValueAtTime(voice.masterGain.gain.value, now);
      voice.masterGain.gain.exponentialRampToValueAtTime(0.0001, now + releaseTime);

      voice.osc1.stop(now + releaseTime + 0.05);
      voice.osc2.stop(now + releaseTime + 0.05);
    }

    function triggerNoteStart(noteObj, isAutoPlay = false) {
      if (activeVoices.has(noteObj.note)) return;
      const voice = playNote(noteObj.freq);
      activeVoices.set(noteObj.note, voice);

      const keyEl = noteElements.get(noteObj.note);
      if (keyEl) {
        if (isAutoPlay) keyEl.classList.add('auto-highlight');
        else keyEl.classList.add('active');
      }

      if (isRecording && !isAutoPlay) {
        currentRecording.push({
          note: noteObj.note,
          action: 'down',
          time: performance.now() - recordStartTime
        });
      }
    }

    function triggerNoteEnd(noteObj, isAutoPlay = false) {
      const voice = activeVoices.get(noteObj.note);
      if (voice) {
        stopNoteVoice(voice);
        activeVoices.delete(noteObj.note);
      }

      const keyEl = noteElements.get(noteObj.note);
      if (keyEl) {
        keyEl.classList.remove('active', 'auto-highlight');
      }

      if (isRecording && !isAutoPlay) {
        currentRecording.push({
          note: noteObj.note,
          action: 'up',
          time: performance.now() - recordStartTime
        });
      }
    }

    const TOTAL_WHITE_KEYS = 15;

    function buildPiano() {
      let whiteKeyIndex = 0;

      NOTES.forEach((item) => {
        noteMapByNote.set(item.note, item);
        noteMapByKey.set(item.key.toLowerCase(), item);

        const keyEl = document.createElement('div');
        keyEl.className = `key ${item.type === 'white' ? 'white-key' : 'black-key'}`;
        keyEl.dataset.note = item.note;
        noteElements.set(item.note, keyEl);

        const labelEl = document.createElement('div');
        labelEl.className = 'key-label';

        const solfegeSpan = document.createElement('span');

        solfegeSpan.textContent = item.solfege;

        const kbdSpan = document.createElement('span');
        kbdSpan.className = 'kbd-hint';
        kbdSpan.textContent = item.key.toUpperCase();

        labelEl.appendChild(solfegeSpan);
        labelEl.appendChild(kbdSpan);
        keyEl.appendChild(labelEl);

        if (item.type === 'white') {
          pianoKeysEl.appendChild(keyEl);
          whiteKeyIndex++;
        } else {
          const percentLeft = (whiteKeyIndex / TOTAL_WHITE_KEYS) * 100 - (4.2 / 2);

          pianoKeysEl.appendChild(keyEl);

      });

    function handleTouch(e) {
      e.preventDefault();
      const touch = e.touches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      const keyEl = target ? target.closest('.key') : null;

      if (keyEl) {
        const noteObj = noteMapByNote.get(keyEl.dataset.note);
        if (noteObj && noteObj !== currentTouchNote) {
          if (currentTouchNote) triggerNoteEnd(currentTouchNote);
          currentTouchNote = noteObj;
          triggerNoteStart(noteObj);

      } else if (currentTouchNote) {
        triggerNoteEnd(currentTouchNote);

    // Canvas 繪製動態琴鍵畫面供影片錄製
    function drawCanvasFrame() {
      canvasCtx.fillStyle = '#25232A';
      canvasCtx.fillRect(0, 0, recorderCanvas.width, recorderCanvas.height);

      // 繪製背景裝飾文字
      canvasCtx.fillStyle = '#FFCAD4';
      canvasCtx.font = 'bold 20px sans-serif';
      canvasCtx.fillText('🎹 迷你鋼琴 - 精彩演奏錄製', 20, 36);

      const totalWhite = 15;
      const keyW = (recorderCanvas.width - 40) / totalWhite;
      const keyH = 240;
      const startX = 20;
      const startY = 55;

      let whiteIdx = 0;
      NOTES.forEach(item => {
        const keyEl = noteElements.get(item.note);
        const isLit = keyEl && (keyEl.classList.contains('active') || keyEl.classList.contains('auto-highlight'));

        if (item.type === 'white') {
          const x = startX + whiteIdx * keyW;
          canvasCtx.fillStyle = isLit ? '#FFE4EC' : '#FFFFFF';
          canvasCtx.strokeStyle = '#D0CBD4';
          canvasCtx.lineWidth = 2;
          canvasCtx.fillRect(x + 1, startY, keyW - 2, keyH);
          canvasCtx.strokeRect(x + 1, startY, keyW - 2, keyH);

          canvasCtx.fillStyle = '#5D5468';
          canvasCtx.font = 'bold 12px sans-serif';
          canvasCtx.fillText(item.solfege, x + keyW / 2 - 10, startY + keyH - 12);
          whiteIdx++;
        }
      });

      whiteIdx = 0;
      NOTES.forEach(item => {
        if (item.type === 'white') {
          whiteIdx++;
        } else {
          const keyEl = noteElements.get(item.note);
          const isLit = keyEl && (keyEl.classList.contains('active') || keyEl.classList.contains('auto-highlight'));
          const x = startX + whiteIdx * keyW - (keyW * 0.3);
          canvasCtx.fillStyle = isLit ? '#D291BC' : '#2B2830';
          canvasCtx.fillRect(x, startY, keyW * 0.6, keyH * 0.6);
        }
      });

      if (isRecording) {
        canvasAnimationId = requestAnimationFrame(drawCanvasFrame);
      }
    }

    recordBtn.addEventListener('click', () => {

    // PCM 離線渲染生成標準 WAV 檔案 (雙擊直接隨處播放)
    exportWavBtn.addEventListener('click', async () => {
      if (currentRecording.length === 0) return;
      statusBadge.textContent = '正在合成無損 WAV 音訊中...';

      const totalDuration = ((currentRecording[currentRecording.length - 1]?.time || 1000) + 2000) / 1000;
      const sampleRate = 44100;
      const offlineCtx = new OfflineAudioContext(2, Math.ceil(sampleRate * totalDuration), sampleRate);

      currentRecording.forEach(evt => {
        if (evt.action === 'down') {
          const item = noteMapByNote.get(evt.note);
          if (item) {
            const startTime = evt.time / 1000;
            const osc = offlineCtx.createOscillator();
            const gain = offlineCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(item.freq, startTime);

            gain.gain.setValueAtTime(0.001, startTime);
            gain.gain.exponentialRampToValueAtTime(0.6, startTime + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.8);

            osc.connect(gain);
            gain.connect(offlineCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + 1.85);
          }
        }
      });

      const renderedBuffer = await offlineCtx.startRendering();
      const wavBlob = audioBufferToWavBlob(renderedBuffer);
      downloadBlob(wavBlob, `${songNameInput.value.trim() || 'piano_audio'}.wav`);
      statusBadge.textContent = 'WAV 音訊檔下載成功 🎵';
    });

    function audioBufferToWavBlob(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      const channels = [];
      let sample = 0;
      let offset = 0;
      let pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      // WAV Header
      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);
      setUint32(0x45564157); // "WAVE"
      setUint32(0x20746d66); // "fmt "
      setUint32(16);
      setUint16(1); // PCM
      setUint16(numOfChan);
      setUint32(buffer.sampleRate);
      setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      setUint32(0x61746164); // "data"
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }
      return new Blob([out.buffer], { type: 'audio/wav' });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function stopAllAudioPlay() {
      activePlaybackTimeouts.forEach(t => clearTimeout(t));
      activePlaybackTimeouts = [];
      activeVoices.forEach((_, noteName) => {
        const item = noteMapByNote.get(noteName);
        if (item) triggerNoteEnd(item, true);
      });
      document.querySelectorAll('.key').forEach(k => k.classList.remove('active', 'auto-highlight'));
      playSongBtn.disabled = false;

    function playNoteSequence(sequence, title = '樂曲') {
      stopAllAudioPlay();
      getAudioContext();
      statusBadge.textContent = `▶ 正在示範: ${title}`;

      let accumulated = 0;
      sequence.forEach(([noteName, dur]) => {
        if (noteName !== 'REST') {
          const noteObj = noteMapByNote.get(noteName);
          if (noteObj) {
            const startT = setTimeout(() => { triggerNoteStart(noteObj, true); }, accumulated);
            const stopT = setTimeout(() => { triggerNoteEnd(noteObj, true); }, accumulated + dur * 0.85);
            activePlaybackTimeouts.push(startT, stopT);
          }
        }
        accumulated += dur;
      });

      const finishT = setTimeout(() => {
        statusBadge.textContent = '播放完畢 ✨';
        playSongBtn.disabled = false;
      }, accumulated + 300);
      activePlaybackTimeouts.push(finishT);
    }

    playSongBtn.addEventListener('click', () => {
      const songKey = songSelect.value;
      if (songKey === 'none') {
        alert('請先在選單中選擇一首示範曲目！');
        return;
      }
      playNoteSequence(SONGS[songKey], songSelect.options[songSelect.selectedIndex].text);
    });

    stopSongBtn.addEventListener('click', stopAllAudioPlay);

    /* =========================================
       9. 自訂樂譜學習引擎 (支援簡譜、音名、按鍵解析)
       ========================================= */
    const customSheetInput = document.getElementById('customSheetInput');
    const playCustomSheetBtn = document.getElementById('playCustomSheetBtn');
    const fillSampleSheetBtn = document.getElementById('fillSampleSheetBtn');

    fillSampleSheetBtn.addEventListener('click', () => {
      customSheetInput.value = 'C4 D4 E4 C4 C4 D4 E4 C4 E4 F4 G4 E4 F4 G4';
      statusBadge.textContent = '已載入《兩隻老虎》樂譜，點擊示範即可學習！';
    });

    // 智能樂譜解析器：支援「C4 D4 E4」音名、「A S D F」鍵位 或「1 2 3 4」簡譜
    function parseCustomSheet(text) {
      const tokens = text.trim().split(/\s+/);
      const parsedNotes = [];

      tokens.forEach(tok => {
        const upper = tok.toUpperCase();
        // 1. 比對完整音名 (如 C4, D#4, G5)
        if (noteMapByNote.has(upper)) {
          parsedNotes.push([upper, 400]);
          return;
        }

        // 2. 比對鍵盤字母 (如 A, S, D, W)
        const keyItem = noteMapByKey.get(tok.toLowerCase());
        if (keyItem) {
          parsedNotes.push([keyItem.note, 400]);
          return;
        }

        // 3. 比對簡譜數字 1~7 (預設中央 C4)
        const numMap = { '1': 'C4', '2': 'D4', '3': 'E4', '4': 'F4', '5': 'G4', '6': 'A4', '7': 'B4' };
        if (numMap[tok]) {
          parsedNotes.push([numMap[tok], 400]);
        }
      });
      return parsedNotes;
    }

    playCustomSheetBtn.addEventListener('click', () => {
      const text = customSheetInput.value.trim();
      if (!text) {
        alert('請先在輸入框貼上或輸入想學習的樂譜代碼！');
        return;
      }
      const sequence = parseCustomSheet(text);
      if (sequence.length === 0) {
        alert('無法解析樂譜，請輸入正確的音名 (如 C4 D4 E4)、按鍵字母 (如 A S D) 或簡譜數字 (如 1 2 3)！');
        return;
      }
      playNoteSequence(sequence, '自訂樂譜');
    });
  </script>
