<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可愛風小鋼琴 (Mini Piano)</title>
  <style>
    :root {
      --bg-color: #FFF9F4;
      --card-bg: #FFFFFF;
      --primary: #FFB7B2;
      --primary-hover: #FFAAA6;
      --accent: #B5EAD7;
      --accent-hover: #9FE2CB;
      --text: #5D576B;
      --white-key: #FFFFFF;
      --white-key-border: #E8E5E1;
      --black-key: #3E3B46;
      --shadow: 0 8px 24px rgba(149, 157, 165, 0.15);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .piano-app {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 30px;
      max-width: 1060px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 頂部標題 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #F3E9E2;
      padding-bottom: 14px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #FF8B94;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.85rem;
      background: #FFF1E6;
      color: #D67D65;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* 控制面板 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button, select {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 25px;
      border: 2px solid transparent;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      background: #F4F3F0;
      color: var(--text);
    }

    button:hover {
      background: #EBE8E3;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    button.active {
      background: var(--primary);
      color: white;
    }

    button.recording {
      background: #FF6B6B;
      color: white;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    select {
      background: #FFF0F2;
      color: #D65A68;
      border: 1px solid #FFD3DA;
      cursor: pointer;
    }

    /* 鋼琴本體容器 */
    .piano-wrapper {
      position: relative;
      overflow-x: auto;
      padding: 10px 0 20px 0;
      display: flex;
      justify-content: center;
    }

    .piano {
      position: relative;
      display: flex;
      height: 240px;
      background: #2D2A32;
      padding: 10px 12px 12px 12px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    /* 琴鍵樣式 */
    .key {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 12px;
      cursor: pointer;
      user-select: none;
    }

    /* 依需求：不添加按下的下沉/高亮視覺回饋 */
    .key:active {
      /* 維持純淨視覺，無變化 */
    }

    .white-key {
      width: 58px;
      height: 100%;
      background: var(--white-key);
      border: 1px solid var(--white-key-border);
      border-radius: 0 0 8px 8px;
      z-index: 1;
      margin: 0 1px;
    }

    .black-key {
      width: 34px;
      height: 60%;
      background: var(--black-key);
      border-radius: 0 0 6px 6px;
      z-index: 2;
      position: absolute;
      /* 位置由 JS 精確計算置放於白鍵縫隙 */
    }

    /* 琴鍵上的標籤文字 */
    .key-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      pointer-events: none;
    }

    .solfege {
      font-size: 0.85rem;
      font-weight: 800;
    }

    .kbd-hint {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .white-key .solfege { color: #5D576B; }
    .white-key .kbd-hint { background: #F1ECE6; color: #8F857D; }

    .black-key .solfege { color: #FFDAC1; }
    .black-key .kbd-hint { background: #555060; color: #FFF; }

    /* 隱藏標籤樣式 */
    .hide-labels .key-label {
      display: none;
    }

    /* 底部操作提示 */
    footer {
      font-size: 0.85rem;
      color: #9C95A0;
      text-align: center;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 10px;
    }

    .shortcut-tag {
      background: #F7F5F2;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #6C6674;
    }
  </style>
</head>
<body>

  <div class="piano-app">
    <header>
      <h1>🎹 可愛小鋼琴 <span>♪</span></h1>
      <div id="statusText" class="status-badge">準備就緒</div>
    </header>

    <!-- 工具列面板 -->
    <div class="controls">
      <!-- 標籤與延音功能 -->
      <div class="btn-group">
        <button id="toggleLabelsBtn">標籤：顯示</button>
        <button id="toggleSustainBtn">延音：關閉</button>
      </div>

      <!-- 錄音與回放 -->
      <div class="btn-group">
        <button id="recordBtn">⏺ 錄音</button>
        <button id="playRecordBtn" disabled>▶ 回放</button>
      </div>

      <!-- 示範曲目 -->
      <div class="btn-group">
        <select id="songSelect">
          <option value="none">-- 選擇示範曲目 --</option>
          <option value="star">★ 小星星 (入門)</option>
          <option value="elise">♫ 給愛麗絲 (進階)</option>
        </select>
        <button id="playSongBtn">播放示範</button>
        <button id="stopSongBtn">停止播放</button>
      </div>
    </div>

    <!-- 鋼琴鍵盤區域 -->
    <div class="piano-wrapper">
      <div class="piano" id="piano"></div>
    </div>

    <footer>
      <div>💡 支援滑鼠點擊、按住滑動 (Glissando) 與鍵盤彈奏</div>
      <div>低八度：<span class="shortcut-tag">A S D F G H J</span>（白） / <span class="shortcut-tag">W E T Y U</span>（黑）</div>
      <div>高八度：<span class="shortcut-tag">K L ; ' Z X C V</span>（白） / <span class="shortcut-tag">O P [ ] \</span>（黑）</div>
    </footer>
  </div>

  <script>
    /* =========================================
       1. 25 鍵音符資料庫 (中央 C4 至 C6)
       ========================================= */
    const NOTES = [
      { note: 'C4',  solfege: 'Do',  freq: 261.63, key: 'a',  type: 'white' },
      { note: 'C#4', solfege: 'Di',  freq: 277.18, key: 'w',  type: 'black' },
      { note: 'D4',  solfege: 'Re',  freq: 293.66, key: 's',  type: 'white' },
      { note: 'D#4', solfege: 'Ri',  freq: 311.13, key: 'e',  type: 'black' },
      { note: 'E4',  solfege: 'Mi',  freq: 329.63, key: 'd',  type: 'white' },
      { note: 'F4',  solfege: 'Fa',  freq: 349.23, key: 'f',  type: 'white' },
      { note: 'F#4', solfege: 'Fi',  freq: 369.99, key: 't',  type: 'black' },
      { note: 'G4',  solfege: 'Sol', freq: 392.00, key: 'g',  type: 'white' },
      { note: 'G#4', solfege: 'Si',  freq: 415.30, key: 'y',  type: 'black' },
      { note: 'A4',  solfege: 'La',  freq: 440.00, key: 'h',  type: 'white' },
      { note: 'A#4', solfege: 'Li',  freq: 466.16, key: 'u',  type: 'black' },
      { note: 'B4',  solfege: 'Ti',  freq: 493.88, key: 'j',  type: 'white' },
      
      { note: 'C5',  solfege: 'Do',  freq: 523.25, key: 'k',  type: 'white' },
      { note: 'C#5', solfege: 'Di',  freq: 554.37, key: 'o',  type: 'black' },
      { note: 'D5',  solfege: 'Re',  freq: 587.33, key: 'l',  type: 'white' },
      { note: 'D#5', solfege: 'Ri',  freq: 622.25, key: 'p',  type: 'black' },
      { note: 'E5',  solfege: 'Mi',  freq: 659.25, key: ';',  type: 'white' },
      { note: 'F5',  solfege: 'Fa',  freq: 698.46, key: "'",  type: 'white' },
      { note: 'F#5', solfege: 'Fi',  freq: 739.99, key: '[',  type: 'black' },
      { note: 'G5',  solfege: 'Sol', freq: 783.99, key: 'z',  type: 'white' },
      { note: 'G#5', solfege: 'Si',  freq: 830.61, key: ']',  type: 'black' },
      { note: 'A5',  solfege: 'La',  freq: 880.00, key: 'x',  type: 'white' },
      { note: 'A#5', solfege: 'Li',  freq: 932.33, key: '\\', type: 'black' },
      { note: 'B5',  solfege: 'Ti',  freq: 987.77, key: 'c',  type: 'white' },
      { note: 'C6',  solfege: 'Do',  freq: 1046.50, key: 'v', type: 'white' }
    ];

    /* =========================================
       2. Web Audio API 音效合成引擎
       ========================================= */
    let audioCtx = null;
    let sustainEnabled = false;
    const activeVoices = new Map(); // 記錄目前正在發聲的音源節點

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 古典鋼琴音色合成：基頻正弦波 + 三角波諧波 + 自然音量包絡
    function playNote(freq) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      // 主震盪器 (正弦波，純淨基頻)
      const osc1 = ctx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(freq, now);

      // 泛音震盪器 (三角波，增加木質敲擊泛音)
      const osc2 = ctx.createOscillator();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq * 2, now);

      // 泛音音量混音
      const osc2Gain = ctx.createGain();
      osc2Gain.gain.setValueAtTime(0.25, now);
      osc2.connect(osc2Gain);

      // 主音量包絡控制 (Envelope)
      const masterGain = ctx.createGain();
      // Attack: 快速爬升至最大音量 (0.005 秒)
      masterGain.gain.setValueAtTime(0.001, now);
      masterGain.gain.exponentialRampToValueAtTime(0.6, now + 0.005);
      // Decay: 敲擊後短時間內自然微幅下降
      masterGain.gain.exponentialRampToValueAtTime(0.35, now + 0.25);

      osc1.connect(masterGain);
      osc2Gain.connect(masterGain);
      masterGain.connect(ctx.destination);

      osc1.start(now);
      osc2.start(now);

      return { osc1, osc2, masterGain };
    }

    function stopNoteVoice(voice) {
      if (!voice || !audioCtx) return;
      const now = audioCtx.currentTime;
      const releaseTime = sustainEnabled ? 2.5 : 0.2; // 延音開關控制釋音時間

      voice.masterGain.gain.cancelScheduledValues(now);
      voice.masterGain.gain.setValueAtTime(voice.masterGain.gain.value, now);
      voice.masterGain.gain.exponentialRampToValueAtTime(0.0001, now + releaseTime);

      voice.osc1.stop(now + releaseTime + 0.05);
      voice.osc2.stop(now + releaseTime + 0.05);
    }

    function triggerNoteStart(noteObj) {
      if (activeVoices.has(noteObj.note)) return;
      const voice = playNote(noteObj.freq);
      activeVoices.set(noteObj.note, voice);

      // 若在錄音狀態，記錄音符事件
      if (isRecording) {
        recordedNotes.push({
          note: noteObj.note,
          action: 'down',
          time: performance.now() - recordStartTime
        });
      }
    }

    function triggerNoteEnd(noteObj) {
      const voice = activeVoices.get(noteObj.note);
      if (voice) {
        stopNoteVoice(voice);
        activeVoices.delete(noteObj.note);
      }

      // 若在錄音狀態，記錄釋音事件
      if (isRecording) {
        recordedNotes.push({
          note: noteObj.note,
          action: 'up',
          time: performance.now() - recordStartTime
        });
      }
    }

    /* =========================================
       3. 琴鍵渲染與介面佈局
       ========================================= */
    const pianoEl = document.getElementById('piano');
    const noteMapByNote = new Map();
    const noteMapByKey = new Map();

    const WHITE_KEY_WIDTH = 58;
    const WHITE_KEY_MARGIN = 2; // 左右 margin 總計 2px
    const BLACK_KEY_WIDTH = 34;

    function buildPiano() {
      let whiteKeyIndex = 0;

      NOTES.forEach((item) => {
        noteMapByNote.set(item.note, item);
        noteMapByKey.set(item.key.toLowerCase(), item);

        const keyEl = document.createElement('div');
        keyEl.className = `key ${item.type === 'white' ? 'white-key' : 'black-key'}`;
        keyEl.dataset.note = item.note;

        // 琴鍵標籤（唱名 + 鍵位提示）
        const labelEl = document.createElement('div');
        labelEl.className = 'key-label';

        const solfegeSpan = document.createElement('span');
        solfegeSpan.className = 'solfege';
        solfegeSpan.textContent = item.solfege;

        const kbdSpan = document.createElement('span');
        kbdSpan.className = 'kbd-hint';
        kbdSpan.textContent = item.key.toUpperCase();

        labelEl.appendChild(solfegeSpan);
        labelEl.appendChild(kbdSpan);
        keyEl.appendChild(labelEl);

        if (item.type === 'white') {
          pianoEl.appendChild(keyEl);
          whiteKeyIndex++;
        } else {
          // 精確將黑鍵定位在前一個白鍵右側接縫上
          const leftPos = 12 + (whiteKeyIndex * (WHITE_KEY_WIDTH + WHITE_KEY_MARGIN)) - (BLACK_KEY_WIDTH / 2) - 1;
          keyEl.style.left = `${leftPos}px`;
          pianoEl.appendChild(keyEl);
        }
      });
    }

    buildPiano();

    /* =========================================
       4. 滑鼠、觸控與鍵盤事件監聽
       ========================================= */
    let isMouseDown = false;

    window.addEventListener('mousedown', () => { isMouseDown = true; });
    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      // 停止所有未放開的音
      activeVoices.forEach((voice, noteName) => {
        const item = noteMapByNote.get(noteName);
        if (item) triggerNoteEnd(item);
      });
    });

    // 為琴鍵綁定點擊與滑奏事件
    document.querySelectorAll('.key').forEach(keyEl => {
      const noteName = keyEl.dataset.note;
      const noteObj = noteMapByNote.get(noteName);

      keyEl.addEventListener('mousedown', (e) => {
        e.preventDefault();
        triggerNoteStart(noteObj);
      });

      keyEl.addEventListener('mouseenter', () => {
        if (isMouseDown) triggerNoteStart(noteObj);
      });

      keyEl.addEventListener('mouseleave', () => {
        if (isMouseDown) triggerNoteEnd(noteObj);
      });
    });

    // 觸控螢幕滑動 (Touch Glissando) 支援
    let currentTouchNote = null;
    pianoEl.addEventListener('touchstart', handleTouch, { passive: false });
    pianoEl.addEventListener('touchmove', handleTouch, { passive: false });
    pianoEl.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (currentTouchNote) {
        triggerNoteEnd(currentTouchNote);
        currentTouchNote = null;
      }
    });

    function handleTouch(e) {
      e.preventDefault();
      const touch = e.touches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      const keyEl = target ? target.closest('.key') : null;

      if (keyEl) {
        const noteObj = noteMapByNote.get(keyEl.dataset.note);
        if (noteObj && noteObj !== currentTouchNote) {
          if (currentTouchNote) triggerNoteEnd(currentTouchNote);
          currentTouchNote = noteObj;
          triggerNoteStart(noteObj);
        }
      } else if (currentTouchNote) {
        triggerNoteEnd(currentTouchNote);
        currentTouchNote = null;
      }
    }

    // 電腦鍵盤按鍵映射
    const pressedPhysicalKeys = new Set();
    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const key = e.key.toLowerCase();
      if (noteMapByKey.has(key) && !pressedPhysicalKeys.has(key)) {
        pressedPhysicalKeys.add(key);
        triggerNoteStart(noteMapByKey.get(key));
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (pressedPhysicalKeys.has(key)) {
        pressedPhysicalKeys.delete(key);
        triggerNoteEnd(noteMapByKey.get(key));
      }
    });

    /* =========================================
       5. 工具列功能（標籤開關、延音開關）
       ========================================= */
    const toggleLabelsBtn = document.getElementById('toggleLabelsBtn');
    let labelsVisible = true;
    toggleLabelsBtn.addEventListener('click', () => {
      labelsVisible = !labelsVisible;
      pianoEl.classList.toggle('hide-labels', !labelsVisible);
      toggleLabelsBtn.textContent = `標籤：${labelsVisible ? '顯示' : '隱藏'}`;
    });

    const toggleSustainBtn = document.getElementById('toggleSustainBtn');
    toggleSustainBtn.addEventListener('click', () => {
      sustainEnabled = !sustainEnabled;
      toggleSustainBtn.classList.toggle('active', sustainEnabled);
      toggleSustainBtn.textContent = `延音：${sustainEnabled ? '開啟' : '關閉'}`;
    });

    /* =========================================
       6. 錄音與回放功能 (Recorder)
       ========================================= */
    const recordBtn = document.getElementById('recordBtn');
    const playRecordBtn = document.getElementById('playRecordBtn');
    const statusText = document.getElementById('statusText');

    let isRecording = false;
    let recordStartTime = 0;
    let recordedNotes = [];
    let playbackTimeouts = [];

    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        // 開始錄音
        getAudioContext();
        isRecording = true;
        recordedNotes = [];
        recordStartTime = performance.now();
        recordBtn.classList.add('recording');
        recordBtn.textContent = '⏹ 停止錄音';
        playRecordBtn.disabled = true;
        statusText.textContent = '錄音中...';
      } else {
        // 停止錄音
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '⏺ 錄音';
        statusText.textContent = `錄音完成 (${recordedNotes.length} 個動作)`;
        playRecordBtn.disabled = recordedNotes.length === 0;
      }
    });

    playRecordBtn.addEventListener('click', () => {
      if (recordedNotes.length === 0) return;
      getAudioContext();
      statusText.textContent = '回放彈奏中...';
      playRecordBtn.disabled = true;

      recordedNotes.forEach(item => {
        const t = setTimeout(() => {
          const noteObj = noteMapByNote.get(item.note);
          if (noteObj) {
            if (item.action === 'down') triggerNoteStart(noteObj);
            else triggerNoteEnd(noteObj);
          }
        }, item.time);
        playbackTimeouts.push(t);
      });

      const totalTime = recordedNotes[recordedNotes.length - 1].time + 800;
      const endTimeout = setTimeout(() => {
        statusText.textContent = '回放結束';
        playRecordBtn.disabled = false;
      }, totalTime);
      playbackTimeouts.push(endTimeout);
    });

    /* =========================================
       7. 內建示範曲目 (小星星、給愛麗絲)
       ========================================= */
    const songSelect = document.getElementById('songSelect');
    const playSongBtn = document.getElementById('playSongBtn');
    const stopSongBtn = document.getElementById('stopSongBtn');
    let demoTimeouts = [];

    // 示範樂曲樂譜陣列 [note, duration (ms)]
    const SONGS = {
      // 小星星 (簡化版)
      star: [
        ['C4', 400], ['C4', 400], ['G4', 400], ['G4', 400], ['A4', 400], ['A4', 400], ['G4', 800],
        ['F4', 400], ['F4', 400], ['E4', 400], ['E4', 400], ['D4', 400], ['D4', 400], ['C4', 800],
        ['G4', 400], ['G4', 400], ['F4', 400], ['F4', 400], ['E4', 400], ['E4', 400], ['D4', 800],
        ['G4', 400], ['G4', 400], ['F4', 400], ['F4', 400], ['E4', 400], ['E4', 400], ['D4', 800],
        ['C4', 400], ['C4', 400], ['G4', 400], ['G4', 400], ['A4', 400], ['A4', 400], ['G4', 800],
        ['F4', 400], ['F4', 400], ['E4', 400], ['E4', 400], ['D4', 400], ['D4', 400], ['C4', 800]
      ],
      // 給愛麗絲 (Für Elise 前段主題)
      elise: [
        ['E5', 250], ['D#5', 250], ['E5', 250], ['D#5', 250], ['E5', 250], ['B4', 250], ['D5', 250], ['C5', 250],
        ['A4', 500], ['REST', 150],
        ['C4', 250], ['E4', 250], ['A4', 250], ['B4', 500], ['REST', 150],
        ['E4', 250], ['G#4', 250], ['B4', 250], ['C5', 500], ['REST', 150],
        ['E4', 250],
        ['E5', 250], ['D#5', 250], ['E5', 250], ['D#5', 250], ['E5', 250], ['B4', 250], ['D5', 250], ['C5', 250],
        ['A4', 500], ['REST', 150],
        ['C4', 250], ['E4', 250], ['A4', 250], ['B4', 500], ['REST', 150],
        ['E4', 250], ['C5', 250], ['B4', 250], ['A4', 700]
      ]
    };

    function stopAllPlayback() {
      demoTimeouts.forEach(t => clearTimeout(t));
      demoTimeouts = [];
      playbackTimeouts.forEach(t => clearTimeout(t));
      playbackTimeouts = [];
      activeVoices.forEach((voice, noteName) => {
        const item = noteMapByNote.get(noteName);
        if (item) triggerNoteEnd(item);
      });
      statusText.textContent = '已停止播放';
      playSongBtn.disabled = false;
      if (recordedNotes.length > 0) playRecordBtn.disabled = false;
    }

    playSongBtn.addEventListener('click', () => {
      const songKey = songSelect.value;
      if (songKey === 'none') {
        alert('請先在選單中挑選一首示範曲目！');
        return;
      }

      stopAllPlayback();
      getAudioContext();
      playSongBtn.disabled = true;
      statusText.textContent = `播放中: ${songSelect.options[songSelect.selectedIndex].text}`;

      const songData = SONGS[songKey];
      let accumulatedTime = 0;

      songData.forEach(([noteName, dur]) => {
        if (noteName !== 'REST') {
          const noteObj = noteMapByNote.get(noteName);
          if (noteObj) {
            const startTimeout = setTimeout(() => {
              triggerNoteStart(noteObj);
            }, accumulatedTime);

            const stopTimeout = setTimeout(() => {
              triggerNoteEnd(noteObj);
            }, accumulatedTime + dur * 0.85);

            demoTimeouts.push(startTimeout, stopTimeout);
          }
        }
        accumulatedTime += dur;
      });

      const finishTimeout = setTimeout(() => {
        statusText.textContent = '示範曲播放完畢';
        playSongBtn.disabled = false;
      }, accumulatedTime + 300);
      demoTimeouts.push(finishTimeout);
    });

    stopSongBtn.addEventListener('click', stopAllPlayback);
  </script>
</body>
</html>
